- type: entity
  parent: BaseItem
  id: SkillchipHackDoor
  name: makeshift door sequencer quickhack datashard
  description: Contains a fragment of code that abuses a bug in standard airlocks to force them open. Seems cobbled together from a variety of scrap electronics.
  components:
    - type: Sprite
      sprite: _Crescent/Objects/Misc/skillchips.rsi
      layers:
        - state: makeshiftchip
    - type: Skillchip
      onImplantFunctions:
      - !type:TraitAddActions
        actions:
        - ActionDoorHack
      onRemoveFunctions:
      - !type:TraitRemoveActions
        actions:
        - ActionDoorHack

- type: entity
  parent: BaseItem
  id: SkillchipHackDoorInterdyne
  name: Door sequencer quickhack datashard
  description: Contains a fragment of code that abuses a bug in standard airlocks to force them open. Seems cobbled together from a variety of scrap electronics.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Misc/skillchips.rsi
    layers:
    - state: black_chip_1
  - type: Skillchip
    onImplantFunctions:
    - !type:TraitAddActions
      actions:
      - ActionDoorHack
    onRemoveFunctions:
    - !type:TraitRemoveActions
      actions:
      - ActionDoorHack

- type: entity
  parent: BaseItem
  id: SkillchipHackSyndyCatCD
  name: SyndyCat quickhack datashard
  description: This chip allows the user to connect to an ancient relay, allowing the deployment of a SyndyCat.
  components:
  - type: Sprite
    sprite: _Crescent/Objects/Misc/skillchips.rsi
    layers:
    - state: black_chip_3
  - type: Skillchip
    onImplantFunctions:
    - !type:TraitAddActions
      actions:
      - ActionSpawnSyndyCat
    onRemoveFunctions:
    - !type:TraitRemoveActions
      actions:
      - ActionSpawnSyndyCat

- type: entity
  parent: BaseItem
  id: SkillchipAdmeme
  name: skillchip that does nothing
  description: Admemery at work, people.
  components:
    - type: Sprite
      sprite: Objects/Devices/encryption_keys.rsi
      layers:
        - state: crypt_gray
    - type: Skillchip
      onImplantFunctions:
      - !type:TraitPushDescription
        descriptionExtensions:
        - description: examine-dermal-armor-message
          fontSize: 12
          requireDetailRange: true
      onRemoveFunctions:
      - !type:TraitPopDescription
        descriptionExtensions:
        - description: examine-dermal-armor-message
          fontSize: 12
          requireDetailRange: true
