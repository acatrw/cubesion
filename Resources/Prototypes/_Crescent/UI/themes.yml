# Gunmetal HUD for Hullrot:Eclipsion. Only the textures under the path are overridden; anything missing
# falls back to /Textures/Interface/Default. The active hand frame and item status highlight are drawn
# white and tinted with the faction accent (FactionAccentSystem), which the _accentTint key opts into.
- type: uiTheme
  id: EclipsionTheme
  path: /Textures/_Crescent/Interface/Eclipsion/Hud/
  colors:
    whiteText: "#D3D9E0"
    slotSelectedGold: "#7E9CB8"
    slotColor: "#0F1216"
    slotOutline: "#2E343B"
    slotText: "#2E343B"
    nanoGold: "#A88B5E"
    goodGreenFore: "#31843E"
    concerningOrangeFore: "#A5762F"
    dangerousRedFore: "#BB3232"
    disabledFore: "#5A5A5A"
    _itemstatus_content_margin_right: "#06060404"
    _itemstatus_content_margin_left: "#04060604"
    _accentTint: "#FFFFFF"

- type: hudTheme
  id: EclipsionTheme
  name: ui-options-hud-theme-eclipsion
  path: Eclipsion
  order: -2
